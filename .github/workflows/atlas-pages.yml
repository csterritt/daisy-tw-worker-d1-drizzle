name: Deploy system atlas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Notes/system-atlas/**'
      - '.github/workflows/atlas-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild atlas from data.mjs
        run: node Notes/system-atlas/atlas/build.mjs

      - name: Stage Pages site
        run: |
          mkdir -p _site
          cp Notes/system-atlas/atlas.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
