<!doctype html>
<meta charset="utf-8">
<title>Mini Auth Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#E6DFBE; --paper-2:#DCD4AF; --ink:#17170F; --ink-2:#6E6B54; --rule:#B9B293; --ghost:#8E8A70;
  --hi-bg:#17170F; --hi-fg:#E6DFBE; --face:#EFE9CC; --grid:#CFC8A3;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
    --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
  --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:hidden}
#app{display:grid;grid-template-rows:52px 1fr 30px;height:100vh;min-height:600px}
#top{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink);overflow:hidden}
.stat{padding:6px 14px 4px;border-right:1.5px solid var(--ink);min-width:0;white-space:nowrap}
.stat .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-size:15px;font-variant-numeric:tabular-nums}
.stat.grow{flex:1;border-right:none;overflow:hidden}
#controls{display:flex;gap:8px;align-items:center;padding:0 14px;border-left:1.5px solid var(--ink)}
button.ctl{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
button.ctl:hover{background:var(--face)}
button.ctl:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
button.ctl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.ctl.primary{background:var(--hi-bg);color:var(--hi-fg)}
button.ctl.primary:hover{background:var(--hi-bg);opacity:.9}
button.ctl:disabled{opacity:.4;cursor:default;box-shadow:none}
#main{display:grid;grid-template-columns:232px 1fr 440px;min-height:0}
#index{border-right:1.5px solid var(--ink);overflow-y:auto;padding:10px 8px 20px}
#index h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:12px 4px 6px;font-weight:500}
#index h4:first-child{margin-top:2px}
.ix{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font:inherit;font-size:11.5px;line-height:1.3;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:7px 8px;margin:0 0 6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em}
.ix .code{color:var(--ink-2);min-width:16px;font-size:10px;padding-top:1px}
.ix .nm{flex:1}
.ix .n{color:var(--ink-2);font-size:10.5px;font-variant-numeric:tabular-nums}
.ix.ghost{border-style:dashed;box-shadow:none;color:var(--ink-2)}
.ix.later{border-color:var(--rule);box-shadow:none;color:var(--ink-2);opacity:.75}
.ix.later .n{font-size:9px;letter-spacing:.06em}
.ix.new{outline:1.5px dashed var(--ink);outline-offset:2px}
.ix.on{background:var(--hi-bg);color:var(--hi-fg)}
.ix.on .code,.ix.on .n{color:var(--hi-fg);opacity:.75}
.ix:hover:not(.on){background:var(--face)}
.ix:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#canvasWrap{position:relative;min-width:0;background:var(--paper)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.dragging{cursor:grabbing}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:30px;height:26px;font:inherit;font-size:14px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
#rail{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
#rail .ch{width:22px;height:22px;font:inherit;font-size:10px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;padding:0;line-height:1}
#rail .ch.done{background:var(--face)}
#rail .ch.on{background:var(--hi-bg);color:var(--hi-fg)}
#rail .ch.locked{border-style:dashed;color:var(--ink-2)}
#rail .ch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#rail .title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}
#rail .title b{color:var(--ink);font-weight:500}
#flowSel{position:absolute;left:12px;bottom:12px;display:none;gap:6px}
#flowSel button{font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);padding:3px 8px;cursor:pointer}
#flowSel button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tip{position:absolute;pointer-events:none;background:var(--hi-bg);color:var(--hi-fg);font-size:11px;padding:4px 8px;max-width:280px;line-height:1.35;display:none;z-index:5}
#panel{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1.5px solid var(--ink)}
#tabs button{flex:1;font:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:9px 6px;background:var(--paper);color:var(--ink);border:none;border-right:1.5px solid var(--ink);cursor:pointer}
#tabs button:last-child{border-right:none}
#tabs button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
#body{overflow-y:auto;padding:14px 18px 40px;flex:1}
.eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1.t{font-size:22px;font-weight:500;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.lede{font-size:14.5px;line-height:1.5;margin:0 0 14px;max-width:56ch}
.sub{color:var(--ink-2);font-size:11px;margin-bottom:14px}
h3.sec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:20px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
#body p{margin:0 0 12px;max-width:62ch}
#body ul{margin:0 0 12px;padding-left:18px;max-width:62ch}
#body li{margin-bottom:6px}
mark{background:var(--hi-bg);color:var(--hi-fg);padding:0 3px}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:1px 6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin:0 6px 6px 0;background:var(--paper);color:var(--ink);font-family:inherit;cursor:pointer}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.chip.static{cursor:default}
pre{background:var(--face);border:1.5px solid var(--rule);padding:10px 12px;font-size:11px;line-height:1.45;overflow-x:auto;margin:0 0 12px;white-space:pre}
.step{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:0 0 8px;font-size:12px}
.step .no{color:var(--ink-2);font-variant-numeric:tabular-nums}
.step.cur .no{color:var(--ink);font-weight:600}
.step.cur .tx{background:var(--face);outline:1.5px solid var(--ink);padding:2px 6px}
.actions{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.pk{border:1.5px solid var(--ink);padding:10px 12px;margin:0 0 12px}
.pk .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pk .route{font-size:12px;margin:2px 0 8px}
details{border-top:1.5px solid var(--rule);margin:8px 0 0;padding:6px 0 0}
details summary{cursor:pointer;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details summary::before{content:'+';display:inline-block;width:12px;color:var(--ink)}
details[open] summary::before{content:'−'}
details summary::-webkit-details-marker{display:none}
details > *:not(summary){margin-top:8px}
#hint{border-top:1.5px solid var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;padding:0 14px;gap:14px;overflow:hidden;white-space:nowrap}
.q{padding-left:0;list-style:none}
.q li{position:relative;padding-left:18px}
.q li::before{content:'?';position:absolute;left:0;top:0;color:var(--ink-2)}
.q li.res::before{content:'✓'}
.q li.to::before{content:'→'}
.q li.res>span,.q li.to>span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule)}
.q li.to>span{text-decoration:none}
.q .ans{margin-top:2px;padding-left:10px;border-left:1.5px solid var(--ink)}
.pkt>.lbl{visibility:hidden}
.pkt:hover>.lbl,.pkt.lbl-on>.lbl{visibility:visible}
.node>.hl{visibility:hidden}
.node:hover>.hl,.node.sel>.hl,.node.hov>.hl{visibility:visible}
@keyframes halo{0%{opacity:.9}50%{opacity:.25}100%{opacity:.9}}
.halo{animation:halo 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.halo{animation:none}}
@media (max-width:1100px){#main{grid-template-columns:200px 1fr 360px}}
</style>

<div id="app">
  <div id="top">
    <div id="stats" style="display:flex;min-width:0;flex:1"></div>
    <div id="controls">
      <button class="ctl" id="btnBack">◂ Back</button>
      <button class="ctl primary" id="btnNext">Next ▸</button>
      <button class="ctl" id="btnFlow">‖ Pause</button>
      <button class="ctl" id="btnStep">Trace one step</button>
      <button class="ctl" id="btnReset">Refit</button>
    </div>
  </div>
  <div id="main">
    <nav id="index" aria-label="Structures"></nav>
    <div id="canvasWrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.1"/></pattern>
          <pattern id="hatchLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width=".8" opacity=".55"/></pattern>
        </defs>
        <g id="world"></g>
      </svg>
      <div id="rail"></div>
      <div id="flowSel"></div>
      <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
      <div id="tip"></div>
    </div>
    <aside id="panel">
      <div id="tabs">
        <button data-tab="what" class="on">What it does</button>
        <button data-tab="how">How it's built</button>
        <button data-tab="cond">Open questions</button>
      </div>
      <div id="body"></div>
    </aside>
  </div>
  <div id="hint">
    <span>enter / ] next chapter</span><span>[ back</span><span>hover to read</span><span>click to pin</span><span>→ go inside</span><span>← come out</span><span>click a dot to inspect its packet</span>
  </div>
</div>

<script>
const GROUPS = [{"id":"edge","title":"At the edge"},{"id":"pages","title":"Pages & replies"},{"id":"auth","title":"The auth core"},{"id":"data","title":"Data"},{"id":"dev","title":"Dev & test rig"},{"id":"off","title":"Not yet switched on"}];
const NODES = [{"id":"U","code":"U","name":"Browser","short":"BROWSER","group":"edge","gx":1,"gy":2.5,"w":2,"d":2,"h":18,"kind":"screen","one":"The person at the keyboard — every click is a real HTTP request.","what":"Sign-in, sign-up, password reset and profile are plain HTML pages with forms that POST url-encoded bodies. There is no JavaScript framework on the client; the only script served is a tiny one that reads a \"signed out\" cookie and shows a toast.","how":"Forms hit <code>/auth/*</code> GET pages and <code>handle-*</code> POST routes; sign-in posts straight to <code>/api/auth/sign-in/email</code>. Client-side validation is HTML attributes only (<mark>required, minlength, type=email</mark>). Cookies carry the better-auth session token plus one-shot flash messages.","steps":[["GET page","Fetch a server-rendered page like /auth/sign-in."],["Fill form","Browser enforces required/minlength/type=email before posting."],["POST","url-encoded body to a handle-* route or /api/auth/*."],["303 + cookies","Follow the redirect; flash cookies ride along."],["Read alert","The next page renders the message, then deletes the cookie."]],"cond":[]},{"id":"ST","code":"ST","name":"Static assets","short":"ASSETS","group":"edge","gx":4,"gy":1.2,"w":3,"d":2,"h":10,"kind":"slab","one":"Files Cloudflare serves without waking the Worker.","what":"The compiled Tailwind/Daisy stylesheet — and in production, the landing page — live in public/. Cloudflare's asset layer serves them directly: cheap requests that never execute Worker code.","how":"<code>wrangler.jsonc</code> binds <code>ASSETS</code> to <code>./public</code> with <code>run_worker_first: false</code>. The timestamped stylesheet <code>public/style-*.css</code> is referenced from <code>src/renderer.tsx</code>. In production the landing page is meant to be a built <code>index.html</code> here — <mark>visitors who bounce cost zero invocations</mark>.","steps":[["Request","GET /style-….css hits the edge."],["Asset hit","The ASSETS binding serves bytes from public/."],["No Worker","run_worker_first: false — the Worker never runs."]],"cond":["The static index.html landing page depends on the untested prod pipeline — is asset-first landing still the plan?"]},{"id":"G","code":"G","name":"Request guards","short":"GUARDS","group":"edge","gx":7.8,"gy":3,"w":2,"d":2,"h":40,"kind":"gate","one":"Every request clears the same hurdles before it reaches a route.","what":"Security headers, CSRF origin checks, a body-size limit, request logging and runtime env validation all run as Hono middleware. Private pages additionally pass a signed-in check; failing any hurdle means a redirect, not a stack trace.","how":"<code>src/index.ts</code> chains <code>secureHeaders</code> (CSP + permissions policy), <code>csrf</code> origin matching, <code>bodyLimit</code> (1kb dev / 4kb prod), <code>logger</code>, the JSX <code>renderer</code>, then <code>validateEnvBindings</code>. <code>signedInAccess</code> guards <code>/private</code> and <code>/profile</code> — <mark>signed-out users get redirected to /auth/sign-in</mark> with a flash error.","steps":[["Headers","secureHeaders sets CSP + permissions-policy."],["Origin","csrf checks Origin against allowed hosts (test routes skip it)."],["Size","bodyLimit rejects oversized bodies with 413."],["Bindings","validateEnvBindings returns 500 if secrets are missing."],["Session","signedInAccess redirects when user/session context is absent."]],"cond":[{"q":"Is the CSRF origin list correct?","r":"Dev allows localhost + an ALTERNATE_ORIGIN regex; production origins are PRODUCTION:UNCOMMENT markers swapped by clean-for-production."}]},{"id":"W","code":"W","name":"Hono worker","short":"WORKER","group":"edge","gx":10.5,"gy":1.8,"w":3,"d":3,"h":70,"kind":"tall","one":"The single Cloudflare Worker — routing, rendering and orchestrating everything.","what":"One Hono app. On boot it validates env vars, installs middleware, wires better-auth, then mounts a route table that depends on SIGN_UP_MODE: open, gated, interest, both, or no sign-up at all. Unknown paths fall through to a 404 page that deliberately returns HTTP 200.","how":"<code>src/index.ts</code>: env check → middleware → <code>setupBetterAuthMiddleware / Interceptor / Auth</code> → mode-gated <code>build-*</code> and <code>handle-*</code> mounts → <code>build404</code> last. Per request, middleware creates a fresh <code>db</code> client and better-auth resolves the session into <code>c.var.user</code>. <mark>The route set is chosen at boot by SIGN_UP_MODE.</mark>","steps":[["Boot","Validate required env vars; log loudly if any are missing."],["Middleware","Guards, logger, renderer, bindings check, db client."],["Auth wiring","Session middleware, sign-in interceptor, /api/auth/* handler."],["Mount routes","Mode pick: open | gated | interest | both | none."],["404 last","build404 renders the not-found page — with status 200."]],"cond":[{"q":"404s return HTTP 200?","r":"Intentional — e2e asserts 200 + \"Page Not Found\" content (see README). Keep."},"Test routes mount whenever ENABLE_TEST_ROUTES or PLAYWRIGHT is set — clean-for-production strips them, but the prod pipeline is untested."]},{"id":"PG","code":"PG","name":"Pages & forms","short":"PAGES","group":"pages","gx":14.5,"gy":3.5,"w":3,"d":2,"h":26,"kind":"cards","one":"A deck of server-rendered pages — one per screen the user can see.","what":"Sign-in, four sign-up variants, forgot/reset password, await-verification, email-sent, profile, private, sign-out and 404. Each page is a TSX component rendered by Hono's JSX renderer inside a shared layout with navbar, flash alerts and footer.","how":"<code>build-*.tsx</code> files mount GET routes returning <code>c.render(useLayout(c, …))</code>; <code>renderer.tsx</code> supplies doctype + stylesheet. POSTs go to sibling <code>handle-*.ts</code> files that validate with valibot schemas (<code>validators.ts</code>) then redirect. Elements carry <mark>data-testid in kebab-case</mark> — the Playwright contract.","steps":[["GET","Route renders TSX inside useLayout."],["Validate","POST body parsed + checked against a valibot schema."],["Act","Call better-auth api or db-access for the real work."],["Redirect","303 back with a flash cookie — POSTs never render HTML."]],"cond":[]},{"id":"X","code":"X","name":"Sign-in adapter","short":"SIGN-IN ADAPT","group":"pages","gx":6.5,"gy":6.5,"w":2,"d":2,"h":34,"kind":"gate","one":"Translates between HTML forms and better-auth's JSON API — in both directions.","what":"The sign-in form posts to /api/auth/sign-in/email, but better-auth answers JSON. This middleware converts the form body to JSON on the way in, reads the JSON response, and turns it into the redirects users expect: forward to /private on success, back to sign-in with a flash error on failure, or to await-verification when the email is unconfirmed.","how":"<code>better-auth-response-interceptor.ts</code>: <code>captureEmailMiddleware</code> stashes the form email, <code>convertFormDataToJsonRequest</code> rewrites the body, then <code>signInHandler</code> calls <code>auth.handler</code> in-process and maps the outcome — <mark>401 → invalid credentials · 403 EMAIL_NOT_VERIFIED → await-verification · 200 + verified → 303 /private</mark> — copying every Set-Cookie header onto the redirect.","steps":[["Capture email","Clone the request; stash the email for error paths."],["Form → JSON","Rewrite the url-encoded body as application/json."],["auth.handler","Call better-auth in-process, get a Response back."],["Map outcome","200 verified → 303 private; 403 → await-verification; 401 → error."],["Copy cookies","better-auth Set-Cookie headers move onto the 303."]],"cond":[]},{"id":"CK","code":"CK","name":"Flash cookies","short":"FLASH COOKIES","group":"pages","gx":12.8,"gy":7.2,"w":2,"d":2,"h":20,"kind":"box","one":"One-shot cookies that carry messages across a redirect.","what":"POST handlers never render; they redirect. To show \"check your email\" or \"invalid credentials\" on the next page, the handler sets a cookie that the layout reads, renders as an alert, and deletes. EMAIL_ENTERED remembers the address on the verification pages.","how":"<code>redirects.tsx</code>: <code>redirectWithMessage</code> / <code>redirectWithError</code> build a <mark>303 + Set-Cookie</mark> (MESSAGE_FOUND / ERROR_FOUND — httpOnly, sameSite=Strict). <code>useLayout</code> retrieves and removes them on every render; <code>cookie-support.ts</code> wraps the hono cookie helpers. Project rule: never use <code>c.redirect</code> directly.","steps":[["Set","The handler appends Set-Cookie to the 303 response."],["Carry","The browser sends the cookie with the next GET."],["Render","The layout reads it into an alert banner."],["Clear","The layout deletes it — one shot only."]],"cond":[]},{"id":"BA","code":"BA","name":"Better-auth","short":"BETTER-AUTH","group":"auth","gx":8.8,"gy":9.8,"w":3,"d":3,"h":64,"kind":"tall","one":"The auth engine: passwords, sessions, verification and reset tokens.","what":"better-auth does the security-critical work — hashing passwords, issuing session tokens, generating email-verification and password-reset tokens, and owning the user/session/account/verification tables through its Drizzle adapter. App code reaches it two ways: the /api/auth/* HTTP handler, or in-process auth.api.* calls from form handlers.","how":"<code>lib/auth.ts</code> builds the instance: <code>drizzleAdapter(client, {provider: 'sqlite'})</code>, email+password with <mark>requireEmailVerification</mark>, 30-day sessions refreshed daily, and <code>sendVerificationEmail</code> / <code>sendResetPassword</code> delegated to our email service. <code>/api/auth/sign-up/email</code> is 404'd — sign-up only happens through our form handlers so the modes apply.","steps":[["getSession","Middleware resolves the session cookie → user+session, per request."],["signUpEmail","Creates user + credential account; fires the verification email."],["signInEmail","Verifies the password, issues the session-token cookie."],["verifyEmail","Token in the link → emailVerified = true."],["resetPassword","Reset token → new password hash on the account row."]],"cond":[{"q":"Which tables are better-auth's vs ours?","r":"user/session/account/verification are its schema; singleUseCode + interestedEmail are ours (src/db/schema.ts)."},{"q":"Where does the secret live?","r":"BETTER_AUTH_SECRET env var, checked at boot and again per request."}]},{"id":"RL","code":"RL","name":"Rate limiter","short":"RATE LIMIT","group":"auth","gx":5,"gy":10.5,"w":2,"d":2,"h":30,"kind":"gate","one":"Cooldown clocks that keep verification and reset emails from flooding inboxes.","what":"Two dedicated timestamp columns on the account table record when each kind of email was last sent; handlers refuse another send until the window passes. Forgot-password additionally keeps an in-memory map so unknown emails get throttled identically — no \"does this account exist\" timing leak.","how":"<code>account.lastResetEmailAt</code> and <code>lastVerificationEmailAt</code> are updated through db-access helpers — <mark>deliberately not account.updatedAt, which better-auth rewrites</mark>. <code>handle-forgot-password.ts</code> keeps <code>emailRateLimitCache</code>, an isolate-local Map. Window: 3s in dev, 30s in prod (PRODUCTION comments).","steps":[["Read clock","Load the last-sent timestamp for this account."],["Compare","now − lastSent vs the EMAIL_RESEND_TIME window."],["Deny","Under the window → 303 with a wait-N-seconds error."],["Send","Past the window → send the email, then stamp now."]],"cond":["The in-memory forgot-password cache is per-isolate — Cloudflare may run many; it also resets on redeploy. Acceptable at this scale, or move to D1?",{"q":"Is the clock time-travel wired?","r":"Only halfway — set-clock stores a delta cookie, but the rate-limit code calls Date.now() directly; nothing reads the delta yet."}]},{"id":"DA","code":"DA","name":"Data access","short":"DB ACCESS","group":"data","gx":12.2,"gy":10.8,"w":2,"d":2,"h":24,"kind":"box","one":"Our own queries — every one retried and wrapped in a Result, never a bare throw.","what":"The reads and writes the app does outside better-auth: looking up a user with their credential account, stamping rate-limit clocks, atomically claiming invite codes, inserting waitlist emails, deleting accounts. Every call goes through withRetry → Result<T,Error>, so handlers branch on isOk/isErr instead of try/catch.","how":"<code>lib/db-access.ts</code> + <code>db/client.ts</code> (<code>drizzle(d1, {schema})</code> per request). <code>withRetry</code> uses async-retry (5 tries, 20ms dev / 200ms prod floor). <mark>claimSingleUseCode is a single UPDATE … WHERE email IS NULL</mark> — race-safe without transactions. Result type from true-myth.","steps":[["Build client","drizzle() around the PROJECT_DB D1 binding."],["Query","drizzle select/update/delete for the operation."],["Retry","async-retry reruns failures per STANDARD_RETRY_OPTIONS."],["Wrap","Outcome → Result.ok / Result.err for the caller."]],"cond":[]},{"id":"D1","code":"D1","name":"D1 database","short":"D1 DATABASE","group":"data","gx":14.5,"gy":11,"w":3,"d":3,"h":32,"kind":"store","one":"One SQLite database at the edge holding the whole auth state.","what":"Six tables. Four belong to better-auth — user, session, account (password hashes, plus our rate-limit columns riding along), verification (email and reset tokens). Two are ours — singleUseCode for gated sign-up, interestedEmail for the waitlist.","how":"Bound as <code>PROJECT_DB</code> in <code>wrangler.jsonc</code>; schema in <code>src/db/schema.ts</code>, migrations via <code>drizzle-kit generate</code> → <code>drizzle/</code>, applied by <code>build-schema-update.sh</code> locally or <code>schema-prod.sql</code> remotely. <mark>user.name is UNIQUE</mark> — display names double as identity. Deleting a user cascades to sessions and accounts.","steps":[["user","id, name (unique), email (unique), emailVerified."],["session","token, expiresAt, userId — cascades on user delete."],["account","credential password hash + lastReset/VerificationEmailAt."],["verification","identifier / value / expiresAt token rows."],["singleUseCode","code PK; email NULL means unclaimed."],["interestedEmail","email PK — the waitlist."]],"cond":[{"q":"drizzle-kit migrations or hand SQL?","r":"Both — drizzle-kit generates SQL, build-schema-update.sh applies to local D1, and prod uses a manually derived schema-prod.sql."}]},{"id":"IC","code":"IC","name":"Invite gate","short":"INVITE GATE","group":"data","gx":15,"gy":14.6,"w":2.5,"d":2,"h":26,"kind":"gate","one":"Gated mode's bouncer: a single-use code, claimed atomically, released if sign-up fails.","what":"In GATED or BOTH mode the sign-up form carries a code. The handler claims it with one conditional UPDATE — only a request that finds the code unclaimed wins — then creates the account. If anything downstream fails, the claim is released so a real user doesn't lose their invite to a transient error.","how":"<code>processGatedSignUp</code> in <code>sign-up-utils.ts</code>: <code>claimSingleUseCode</code> → <code>signUpEmail</code> → on failure <code>releaseSingleUseCode</code>, which only releases if the code is still held by that email. Interest mode instead inserts into <code>interestedEmail</code>; a unique-violation means \"already on the waitlist\" — <mark>no account is ever created</mark>.","steps":[["Claim","UPDATE singleUseCode SET email WHERE code=? AND email IS NULL."],["Check","1 row changed → claimed; 0 → invalid or already used."],["Sign up","Create the account through better-auth as usual."],["Release","On failure, clear the claim only if we still hold it."]],"cond":["Who hands out codes? There is no admin UI — codes arrive via sqlite3/SQL inserts (the test seed provides WELCOME2024 and friends)."]},{"id":"EM","code":"EM","name":"Email service","short":"EMAIL SVC","group":"auth","gx":5.8,"gy":14,"w":2.5,"d":2,"h":24,"kind":"box","one":"Two transports, one job: confirmation and reset emails that actually arrive.","what":"better-auth asks us to send mail at two moments — verify your address, reset your password. In dev and tests the message goes by SMTP to Mailpit; in production it is a POST to an email-relay endpoint with a bearer code.","how":"<code>lib/email-service.ts</code>: <code>getEmailConfig</code> detects test mode → nodemailer to <code>127.0.0.1:1025</code> (overridable via <code>/test/set-smtp-config</code> for failure tests); otherwise <code>fetch(EMAIL_SEND_URL)</code> with <code>EMAIL_SEND_CODE</code> — <mark>a non-2xx throws, so a failed send is never reported as sent</mark>. The user name is HTML-escaped in the template.","steps":[["Pick transport","Test/dev → SMTP; production → relay POST."],["Render","Inline HTML + text templates with escaped fields."],["Send","nodemailer.sendMail, or fetch to EMAIL_SEND_URL."],["Report","Throw on failure so the caller can flash an error."]],"cond":[{"q":"sending_site 'cls.cloud'?","r":"Hardcoded in the relay POST body — looks like a leftover from another project; fix before prod."}]},{"id":"MP","code":"MP","name":"Mailpit","short":"MAILPIT","group":"dev","gx":2.8,"gy":13.2,"w":2,"d":2,"h":20,"kind":"box","one":"The dev-side SMTP sink that catches every email the app sends.","what":"A local binary run alongside wrangler dev. The app's test-mode transport points at it, so sign-up verifications and reset links land in Mailpit's web UI instead of a real inbox — and Playwright reads them from its API.","how":"<code>run-dev.sh</code> starts wrangler + Mailpit together (concurrently). SMTP on <code>127.0.0.1:1025</code>, web UI at <code>http://localhost:8025</code>. e2e helpers poll Mailpit for the latest message to extract verification and reset links.","steps":[["Start","run-dev.sh launches Mailpit beside wrangler."],["Catch","The app delivers mail over SMTP to :1025."],["Inspect","Humans use the :8025 UI; tests use the API."]],"cond":[]},{"id":"TR","code":"TR","name":"Test hooks","short":"TEST HOOKS","group":"dev","gx":10.2,"gy":14.4,"w":2.5,"d":2,"h":30,"kind":"job","one":"Dev-only routes that let tests reach inside the running app.","what":"A set of /test/* endpoints plus a few auth/* toggles that exist only when ENABLE_TEST_ROUTES or PLAYWRIGHT is set: clear or seed the database, count rows, check codes, override SMTP, clear the rate-limit cache, set a clock delta, inject D1 failures, and report the sign-up mode.","how":"<code>routes/test/{database,sign-up-mode,smtp-config}.ts</code> routers plus <code>handle-{set,reset}-clock.ts</code> and <code>handle-set-db-failures.ts</code>, mounted only when <code>isTestRouteEnabled</code> — <mark>all marked PRODUCTION:REMOVE and stripped by clean-for-production.rb</mark>. The CSRF middleware skips /test/*.","steps":[["Seed","POST /test/database/seed → fixture users, accounts, codes."],["Clear","DELETE /test/database/clear between specs."],["Time","GET /auth/set-clock/:delta stores a delta cookie."],["Fail","SMTP override + DB_FAIL cookies simulate outages."]],"cond":[{"q":"Does the clock delta do anything yet?","r":"Nothing reads it — handlers call Date.now() directly and getCurrentTime has no callers. Dead wiring: wire it or remove it."}]},{"id":"E2E","code":"E2E","name":"Playwright suite","short":"PLAYWRIGHT","group":"dev","gx":2.9,"gy":15.5,"w":2.5,"d":2,"h":32,"kind":"job","one":"A full Playwright harness that drives real sign-up, sign-in and reset journeys.","what":"Browser tests per sign-up mode plus general, profile and reset coverage, sharing helpers for navigation, forms, DB seeding, Mailpit reads and mode detection. Specs skip themselves when the dev server is in the wrong SIGN_UP_MODE.","how":"<code>e2e-tests/</code> folders per mode; <code>support/*-helpers.ts</code> wrap the common flows — <code>db-helpers</code> calls <code>/test/database/*</code>, <code>auth-helpers</code> drives journeys, <code>mode-helpers</code> reads <code>/test/sign-up-mode</code>. Run <code>npx playwright test</code> against an <code>npm run dev-*</code> server. <mark>data-testid attributes are the contract.</mark>","steps":[["Seed","Spec clears/seeds the DB through /test/database/*."],["Drive","Fill forms, submit, assert redirects + flash text."],["Read mail","Poll Mailpit for the verification or reset link."],["Skip modes","mode-helpers skip specs not matching SIGN_UP_MODE."]],"cond":[]},{"id":"GH","code":"GH","name":"Retained utilities","short":"RETAINED","group":"off","ghost":true,"gx":20,"gy":6.5,"w":2,"d":2,"h":24,"kind":"box","one":"Kept-on-purpose helpers with zero callers today.","what":"po-notify.ts posts Pushover alerts to a phone when PO_APP_ID and PO_USER_ID are set. send-email.ts is a reference SMTP/OTP sender. generate-code.ts makes a 6-digit code. None are imported by any route — they are marked \"do not delete without confirming.\"","how":"<code>lib/po-notify.ts</code> (env-gated <code>pushoverNotify</code>), <code>lib/send-email.ts</code> (<code>sendOtpToUserViaEmail</code> via nodemailer+retry+Result), <code>lib/generate-code.ts</code> (<code>generateToken</code>). <mark>Zero call sites in src/.</mark>","steps":[["Kept","Doc comment in each file says to confirm before deleting."],["Gated","Pushover only sends when both env vars exist."],["Waiting","Likely first call site: a \"new user signed up\" alert."]],"cond":["First call site for Pushover: new-sign-up notification, or error spike? Undecided — currently zero callers."]},{"id":"PD","code":"PD","name":"Prod pipeline","short":"PROD PIPELINE","group":"off","ghost":true,"gx":20.5,"gy":12.5,"w":2.5,"d":2,"h":30,"kind":"job","one":"The plan for shipping — strip dev wiring, swap PRODUCTION markers, deploy — never run end to end.","what":"prod_deploy.sh is meant to build the static index.html, run clean-for-production.rb to remove test routes and dev-only code, swap every PRODUCTION:REMOVE/UNCOMMENT marker, then wrangler deploy. The README warns it is \"currently untested, and probably broken.\"","how":"Marker convention across the codebase: <code>// PRODUCTION:REMOVE</code> deletes a line or block, <code>// PRODUCTION:UNCOMMENT</code> activates the prod variant, <code>// PRODUCTION:REMOVE-NEXT-LINE</code> drops the following line. <mark>clean-for-production.rb does the rewrite</mark>; prod secrets (SMTP_*, CLOUDFLARE_*, PO_*) live on Cloudflare.","steps":[["Build","Compile index.html + stylesheet into public/."],["Strip","clean-for-production removes test routes + dev code."],["Swap","PRODUCTION markers flip origins, limits, CSP, durations."],["Deploy","wrangler deploy --minify with prod secrets set."]],"cond":["prod_deploy.sh is untested per README — needs a dry run plus an e2e smoke pass before it can be trusted."]}];

const CH = [{"id":"you","title":"You and the worker","reveal":["U","W"],"lede":"Everything here is one request at a time: you ask, the worker answers.","story":"<p>A visitor opens a page and the Worker renders it — no SPA, no hydration, just HTML. <mark>Every interaction in this system is a plain HTTP request.</mark></p>","flow":[["U","W","GET /auth/sign-in",{"method":"GET","path":"/auth/sign-in"}],["W","U","HTML page",{"status":200,"contentType":"text/html"}]]},{"id":"guards","title":"Guards at the door","reveal":["G"],"lede":"Before any route runs, every request passes the same gantlet.","story":"<p>Security headers, a CSRF origin check, a 1kb body cap, then — for private pages — a session check. <mark>Failing any check means a redirect or a flat error, never a stack trace.</mark></p>","flow":[["U","G","POST + headers",{"origin":"http://localhost:3000","bytes":210}],["G","W","passed",{"checks":["headers","csrf","limit","env"]}],["W","U","303 → /auth/sign-in",{"status":303,"setCookie":"ERROR_FOUND=…"}]]},{"id":"pages","title":"Pages and postcards","reveal":["PG","CK","ST"],"lede":"Pages are rendered server-side; messages travel as cookies on the redirect.","story":"<p>POSTs never return HTML — they 303 back with a one-shot flash cookie, and the layout turns the cookie into an alert on the next page. <mark>Redirects are the reply.</mark></p>","flow":[["U","ST","GET /style-*.css",{"path":"/style-20250722184943.css"}],["ST","U","stylesheet",{"status":200,"via":"ASSETS binding"}],["U","W","POST sign-in (bad creds)",{"email":"me@x.io","password":"wrong"}],["W","U","303 + flash cookie",{"status":303,"setCookie":"ERROR_FOUND=Invalid…"}],["U","W","GET /auth/sign-in",{"cookie":"ERROR_FOUND=…"}],["W","PG","render + read cookie",{"layout":"navbar + alert + footer"}],["PG","W","JSX → HTML",{"testid":"sign-in-page"}],["W","U","page showing the error",{"alert":"Invalid email or password…"}]]},{"id":"brain","title":"The auth brain","reveal":["BA","X"],"lede":"better-auth owns the hard part; an adapter translates form posts into its JSON world.","story":"<p>The sign-in form posts to better-auth's own URL — but HTML people need redirects, not JSON. <mark>A gate converts the request and the response in both directions.</mark></p>","flow":[["U","X","POST /api/auth/sign-in/email",{"email":"me@x.io","password":"••••••••"}],["X","BA","JSON credentials",{"email":"me@x.io","password":"••••••••"}],["BA","X","200 + Set-Cookie",{"sessionToken":"eyJ…","expiresIn":"30d"}],["X","U","303 → /private",{"setCookie":["session_token","MESSAGE_FOUND"]}]]},{"id":"memory","title":"What it remembers","reveal":["DA","D1"],"lede":"Six tables in one D1 database hold every user, session, token and invite.","story":"<p>better-auth reads and writes four tables through its Drizzle adapter; our handlers touch the rest through a retry-and-Result layer. <mark>All state lives in D1 — nothing is kept in the Worker.</mark></p>","flow":[["U","W","GET /private + cookie",{"cookie":"session_token=eyJ…"}],["W","BA","getSession",{"headers":"cookie: session_token"}],["BA","D1","SELECT session + user",{"via":"drizzle adapter"}],["D1","BA","row",{"user":"me@x.io","expiresAt":"+30d"}],["BA","W","user + session",{"user":"me@x.io"}],["W","U","private page",{"status":200,"greeting":"Welcome, me!"}]]},{"id":"joining","title":"Joining up","reveal":["EM","MP"],"lede":"Sign-up ends with an email; in dev, Mailpit catches it.","story":"<p>handle-sign-up calls signUpEmail, which creates the user and fires a verification email. <mark>The account exists but stays unusable until the link is clicked.</mark></p>","flow":[["U","W","POST /auth/sign-up",{"name":"Me","email":"me@x.io"}],["W","BA","signUpEmail",{"email":"me@x.io","callbackURL":"/auth/sign-in/true"}],["BA","D1","insert user + account + token",{"tables":["user","account","verification"]}],["BA","EM","sendConfirmationEmail",{"subject":"Confirm Your Email Address"}],["EM","MP","SMTP :1025",{"to":"me@x.io"}],["W","U","303 → await-verification",{   if(n.inside){ const parent=byId[S.inside]; const i=+n.id.slice(1);
    body.innerHTML=`<div class="eyebrow">Inside ${esc(parent.code)} · ${esc(parent.name)} · step ${i+1} of ${parent.steps.length}</div><h1 class="t">${esc(n.name)}</h1><p class="lede">${esc(n.desc)}</p>
    <h3 class="sec">All steps</h3>${parent.steps.map((s,j)=>`<div class="step ${j===i?'cur':''}"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}
    <div class="actions"><button class="ctl" onclick="comeOut()">← Come back out</button></div>`; return; }
  const status = n.ghost?'<span class="chip ghost static">Not switched on</span>':`<span class="chip static">${n.group==='loop'?'turn loop':n.group==='mem'?'memory':'supporting'}</span>`;
  const pinned=S.selected===n.id;
  let content='';
  if(S.tab==='what') content=`<p class="lede">${n.one}</p><details${pinned?' open':''}><summary>Read more</summary><p>${n.what}</p></details>${n.steps?`<details><summary>Steps in execution</summary>${n.steps.map((s,j)=>`<div class="step"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}</details>`:''}`;
  else if(S.tab==='how') content=`<p class="lede">${n.one}</p><p>${n.how}</p>`;
  else content=`<p class="lede">${n.one}</p>`+(n.cond&&n.cond.length?qHtml(n.cond):`<p>Nothing open here right now.</p>`);
  body.innerHTML=`<div class="eyebrow">${esc(n.code)} · ${pinned?'pinned':'hovering'}${isNew(n.id)?' · new in this chapter':''}</div><h1 class="t">${esc(n.name)}</h1><div class="sub">${status}</div>${content}
  ${pinned?`<div class="actions">${n.steps?`<button class="ctl" onclick="goInside('${n.id}')">→ Go inside</button>`:''}<button class="ctl" onclick="select(null)">Back to chapter</button></div>`:''}`;
}
function renderChapterPanel(){
  const c=CH[S.ch]; const last=S.ch===CH.length-1;
  if(S.tab==='how'){ body.innerHTML=HOW_HTML; return; }
  if(S.tab==='cond'){ body.innerHTML=`<div class="eyebrow">${esc(TITLE)}</div><h1 class="t">Open questions</h1><div class="sub">${last?'everything unresolved, by structure':'for the structures revealed so far'}</div>`+NODES.filter(n=>revealedIds().includes(n.id)&&n.cond&&n.cond.length).map(n=>`<h3 class="sec">${n.code} · ${esc(n.name)}${n.ghost?' <span class="chip ghost static">later</span>':''}</h3>${qHtml(n.cond)}`).join(''); return; }
  const chips = last ? '' : `<h3 class="sec">New in this chapter</h3><div>${c.reveal.map(nodeChip).join('')}</div>`;
  const nav=`<div class="actions"><button class="ctl" onclick="prevCh()" ${S.ch===0?'disabled':''}>◂ Back</button><button class="ctl primary" onclick="nextCh()" ${last?'disabled':''}>${S.ch===CH.length-2?'Show the whole system ▸':'Next ▸'}</button></div>`;
  body.innerHTML=`<div class="eyebrow">Chapter ${S.ch+1} of ${CH.length}</div><h1 class="t">${esc(c.title)}</h1><p class="lede">${c.lede}</p>${c.story}${chips}${nav}
  ${last?`<h3 class="sec">Decisions locked</h3><ul>${DECISIONS_HTML}</ul>`:''}`;
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.selPacket=null;renderPanel();drawPackets();}));

/* ---------------- STATS ---------------- */
function renderStats(){ const el=document.getElementById('stats'); const open=NODES.reduce((a,n)=>a+qOpen(n),0), routed=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.to).length,0), res=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.r).length,0);
  const dyn={chapter:`${S.ch+1} / ${CH.length}`, shown:`${revealedIds().length} / ${NODES.length}`, questions:`${open} open · ${routed} routed · ${res} resolved`};
  const all=[...(STATS||[]), {k:'Chapter',v:dyn.chapter},{k:'Structures shown',v:dyn.shown},{k:'Open questions',v:dyn.questions,grow:true}];
  el.innerHTML=all.map(s=>`<div class="stat${s.grow?' grow':''}"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`).join(''); }

/* ---------------- INDEX + RAIL ---------------- */
function renderIndex(){
  const ix=document.getElementById('index'); ix.innerHTML=''; const rev=new Set(revealedIds());
  GROUPS.forEach(g=>{ const h=document.createElement('h4'); h.textContent=g.title; ix.appendChild(h);
    NODES.filter(n=>n.group===g.id).forEach(n=>{ const b=document.createElement('button'); const shown=rev.has(n.id);
      b.className='ix'+(n.ghost&&shown?' ghost':'')+(!shown?' later':'')+(S.selected===n.id?' on':'')+(isNew(n.id)?' new':''); b.dataset.id=n.id;
      b.innerHTML=`<span class="code">${n.code}</span><span class="nm">${esc(n.name)}</span><span class="n" title="${shown?'open questions':'revealed in chapter'}">${shown?qOpen(n):'ch '+(revealChapterOf(n.id)+1)}</span>`;
      b.addEventListener('click',()=>{ if(!shown){ gotoCh(revealChapterOf(n.id)); select(n.id); return; } if(S.view!=='world')comeOut(); select(n.id); focusNode(n); });
      b.addEventListener('mouseenter',()=>{ if(S.view==='world'&&shown){S.hover=n.id;renderPanel();render();} });
      b.addEventListener('mouseleave',()=>{ if(S.view==='world'){S.hover=null;renderPanel();render();} });
      ix.appendChild(b); }); });
  renderStats();
}
function renderRail(){ const r=document.getElementById('rail'); if(S.view!=='world'){ r.innerHTML=`<span class="title">THE SYSTEM &nbsp;›&nbsp; <b>${esc(byId[S.inside].code)} ${esc(byId[S.inside].name)}</b> &nbsp;·&nbsp; steps in execution</span>`; document.getElementById('flowSel').style.display='none'; return; }
  r.innerHTML=CH.map((c,i)=>`<button class="ch ${i===S.ch?'on':i<S.ch?'done':''} ${i>S.maxCh+1?'locked':''}" title="${esc(c.title)}" onclick="gotoCh(${i})">${i+1}</button>`).join('')+`<span class="title">chapter ${S.ch+1} · <b>${esc(CH[S.ch].title)}</b></span>`;
  const fs=document.getElementById('flowSel'); fs.style.display = S.ch===CH.length-1?'flex':'none';
  if(!fs.dataset.built){ fs.innerHTML=[...FLOWS.map(f=>`<button data-f="${f.id}">${f.name}</button>`),'<button data-f="both">All flows</button>'].join(''); fs.dataset.built='1'; fs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.flowSel=b.dataset.f;buildWorldScene();initPackets();render();renderPanel();})); }
  fs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===S.flowSel));
  document.getElementById('btnBack').disabled=S.ch===0; document.getElementById('btnNext').disabled=S.ch===CH.length-1;
}

/* ---------------- NAV ---------------- */
function select(id){ S.selected=id; S.selPacket=null; renderIndex(); renderPanel(); render(); }
function gotoCh(i){ i=Math.max(0,Math.min(CH.length-1,i)); if(S.view!=='world'){S.view='world';S.inside=null;} S.ch=i; S.maxCh=Math.max(S.maxCh,i); S.selected=null; S.hover=null; S.tab='what'; buildWorldScene(); initPackets(); S.playing=true; syncFlowBtn(); renderIndex(); render(); renderPanel(); fitView(true); }
function nextCh(){ gotoCh(S.ch+1); } function prevCh(){ gotoCh(S.ch-1); }
function goInside(id){ const n=byId[id]; if(!n||!n.steps)return; S.view='inside'; S.inside=id; S.selected='s0'; buildInsideScene(n); initPackets(); fitView(true); renderIndex(); render(); renderPanel(); }
function comeOut(){ const was=S.inside; S.view='world'; S.inside=null; buildWorldScene(); initPackets(); S.selected=was; fitView(true); renderIndex(); render(); renderPanel(); }
function orderList(){ return S.view==='world'?sceneNodes.map(n=>n.id):sceneNodes.map(n=>n.id); }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; const L=orderList(); let i=L.indexOf(S.selected);
  if(e.key==='ArrowDown'){e.preventDefault();select(L[Math.min(L.length-1,i+1)]);}
  else if(e.key==='ArrowUp'){e.preventDefault();select(L[Math.max(0,i-1)]);}
  else if(e.key==='ArrowRight'){e.preventDefault(); if(S.view==='world'&&S.selected)goInside(S.selected);}
  else if(e.key==='ArrowLeft'){e.preventDefault(); if(S.view==='inside')comeOut(); else select(null);}
  else if(e.key==='Enter'||e.key===']'){e.preventDefault(); if(S.view==='world')nextCh();}
  else if(e.key==='['){e.preventDefault(); if(S.view==='world')prevCh();}
  else if(e.key===' '){e.preventDefault();toggleFlow();}
  else if(e.key==='Escape'){select(null);} });

/* ---------------- VIEW / PAN / ZOOM ---------------- */
let tween=null;
function applyView(){ world.setAttribute('transform',`translate(${S.tx},${S.ty}) scale(${S.k})`); }
function tweenTick(){ if(!tween)return; const now=performance.now(); let u=Math.min(1,(now-tween.t0)/tween.dur); u=1-Math.pow(1-u,3); S.tx=tween.a.tx+(tween.b.tx-tween.a.tx)*u; S.ty=tween.a.ty+(tween.b.ty-tween.a.ty)*u; S.k=tween.a.k+(tween.b.k-tween.a.k)*u; applyView(); if(u>=1)tween=null; }
function setView(tx,ty,k,anim){ tween=null; if(anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ tween={a:{tx:S.tx,ty:S.ty,k:S.k},b:{tx,ty,k},t0:performance.now(),dur:520}; } else { S.tx=tx;S.ty=ty;S.k=k;applyView(); } }
function bbox(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; sceneNodes.forEach(n=>{[P(n.gx,n.gy,n.h),P(n.gx+n.w,n.gy,n.h),P(n.gx+n.w,n.gy+n.d,-24),P(n.gx,n.gy+n.d,0),P(n.gx,n.gy,0)].forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});}); return {x0,y0,x1,y1}; }
function fitView(anim){ const r=svg.getBoundingClientRect(); if(!sceneNodes.length)return; const b=bbox(); const pad=40; const k=Math.min((r.width-pad*2)/Math.max(1,b.x1-b.x0),(r.height-pad*2)/Math.max(1,b.y1-b.y0)); if(r.width<80||r.height<80||!isFinite(k)||k<=0)return; const kk=Math.max(.2,Math.min(k,1.5)); setView(r.width/2-((b.x0+b.x1)/2)*kk, r.height/2-((b.y0+b.y1)/2)*kk+8, kk, anim); }
function focusNode(n){ const r=svg.getBoundingClientRect(); const c=P(n.gx+n.w/2,n.gy+n.d/2,n.h/2); setView(r.width/2-c[0]*S.k, r.height/2-c[1]*S.k, S.k, true); }
function zoomAt(f,cx,cy){ tween=null; const nk=Math.max(.35,Math.min(3,S.k*f)); S.tx=cx-(cx-S.tx)*(nk/S.k); S.ty=cy-(cy-S.ty)*(nk/S.k); S.k=nk; applyView(); }
svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.1:0.9,e.clientX-r.left,e.clientY-r.top);},{passive:false});
/* Selection runs on pointerdown rather than click. render() and drawPackets() each
   clear their layer, and both run on hover, so the box or dot under the cursor is
   replaced between press and release — the browser then never synthesises a click on
   it and click-to-pin silently did nothing. Pointer capture is deferred until a drag
   actually starts for the same reason: capturing on pointerdown retargets the click
   to the svg, away from the node. */
function selectPacket(i){ S.selPacket=i; S.playing=false; syncFlowBtn(); renderPanel(); drawPackets(); }
let drag=null, lastTap={id:null,t:0};
svg.addEventListener('pointerdown',e=>{ if(e.button!==0)return; tween=null;
  const hit=e.target.closest?e.target.closest('g.node,g.pkt'):null, isPkt=hit&&hit.classList.contains('pkt');
  drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,moved:false,pid:e.pointerId,
    pkt:isPkt?+hit.dataset.i:null, id:hit&&!isPkt?hit.dataset.id:null}; });
svg.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved){ if(Math.hypot(dx,dy)<=3)return; drag.moved=true; svg.classList.add('dragging'); try{svg.setPointerCapture(drag.pid);}catch(_){} }
  S.tx=drag.tx+dx; S.ty=drag.ty+dy; applyView(); });
svg.addEventListener('pointercancel',()=>{ drag=null; svg.classList.remove('dragging'); });
svg.addEventListener('pointerup',()=>{ const d=drag; drag=null; svg.classList.remove('dragging');
  if(!d||d.moved)return;                                  // a pan, not a tap — leave selection alone
  if(d.pkt!=null){ selectPacket(d.pkt); return; }
  if(d.id==null){ select(null); return; }                 // empty canvas clears the pin
  const n=sceneNodes.find(x=>x.id===d.id), now=performance.now();
  if(lastTap.id===d.id&&now-lastTap.t<400){ lastTap={id:null,t:0}; if(n&&!n.inside&&n.steps){ goInside(d.id); return; } }
  else lastTap={id:d.id,t:now};
  select(d.id); });
document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
window.addEventListener('resize',()=>fitView(false));

/* ---------------- TIP ---------------- */
function showTip(e,n){ tip.style.display='block'; tip.textContent=n.inside?n.desc:(n.ghost?'Later · ':'')+n.name+' — '+(n.one||'').replace(/<[^>]+>/g,''); moveTip(e); }
function moveTip(e){ const r=svg.getBoundingClientRect(); let x=e.clientX-r.left+14,y=e.clientY-r.top+14; if(x+290>r.width)x-=300; if(y+60>r.height)y-=70; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.display='none'; }

/* ---------------- CONTROLS ---------------- */
function toggleFlow(){ S.playing=!S.playing; if(S.playing)S.selPacket=null; syncFlowBtn(); renderPanel(); drawPackets(); }
document.getElementById('btnFlow').onclick=toggleFlow;
document.getElementById('btnStep').onclick=stepOnce;
document.getElementById('btnReset').onclick=()=>{ select(null); fitView(true); };
document.getElementById('btnNext').onclick=nextCh; document.getElementById('btnBack').onclick=prevCh;

/* ---------------- BOOT ---------------- */
gotoCh(0);
</script>
